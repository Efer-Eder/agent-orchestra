# Agent Orchestra: project page and web demo, served as static files.
# Installed as /etc/nginx/snippets/agent-orchestra.conf and included in the
# efer.online server block. Files live in /var/www/agent-orchestra/projeto/agent-orchestra/.

location = /projeto/agent-orchestra {
    return 301 /projeto/agent-orchestra/;
}

# Hashed build assets: cache for a year.
location ^~ /projeto/agent-orchestra/demo/assets/ {
    root /var/www/agent-orchestra;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Web demo. connect-src allows the AI provider the visitor configures; the key
# stays in the tab's memory and requests go from the browser straight to it.
location ^~ /projeto/agent-orchestra/demo/ {
    root /var/www/agent-orchestra;
    index index.html;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}

# Project page.
location ^~ /projeto/agent-orchestra/ {
    root /var/www/agent-orchestra;
    index index.html;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
