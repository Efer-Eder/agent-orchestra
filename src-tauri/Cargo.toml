[package]
name = "agent-orchestra"
version = "0.1.0-alpha.1"
description = "Agent Orchestra desktop shell (in development)"
authors = ["Efer Eder"]
license = "MIT"
repository = "https://github.com/Efer-Eder/agent-orchestra"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "agent_orchestra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
futures-util = { version = "0.3.34", default-features = false }
keyring-core = "1.1.0"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = [] }
tokio = { version = "1.54.1", features = ["time", "macros", "sync"] }
tokio-util = "0.7.20"

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
